name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: SEO and production checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: SEO contracts
        run: |
          npm run test:seo-contract
          npm run seo:local-pages
          npm run test:industry-solutions
      - name: Production build
        env:
          DATABASE_URL: file:./ci.db
        run: |
          npx prisma db push --skip-generate
          npm run build
  deploy:
    name: Deploy via SSH
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/huwa
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            rm -rf node_modules
            npm ci
            mkdir -p backups
            if [ -f prisma/dev.db ]; then
              cp prisma/dev.db "backups/dev.db.$(date +%Y%m%d-%H%M%S)"
              find backups -type f -name 'dev.db.*' -mtime +30 -delete
            fi
            npx prisma db push --skip-generate
            npm run operations:backfill
            npm run seo:backfill
            PREVIOUS_STATIC="$(mktemp -d)"
            trap 'rm -rf "$PREVIOUS_STATIC"' EXIT
            if [ -d .next/static ]; then
              cp -a .next/static/. "$PREVIOUS_STATIC"/
            fi
            rm -rf .next
            npm run build
            mkdir -p .next/static
            cp -an "$PREVIOUS_STATIC"/. .next/static/
            find .next/static -type f -mtime +7 -delete
            find .next/static -depth -type d -empty -delete
            rm -rf "$PREVIOUS_STATIC"
            trap - EXIT
            pm2 restart huwa-web
            echo "✅ Deployment erfolgreich: $(date)"
